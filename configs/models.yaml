# Every model is reached through an OpenAI-compatible endpoint (ADR-004).
# Switch models by editing this file, not code.

teacher:                # ADR-005 (amended): Azure AI Foundry, OpenAI-compatible endpoint
  base_url: https://agentsysfore.services.ai.azure.com/openai/v1/
  model: gpt-4.1        # Foundry deployment name; the only chat deployment found (Step 03 probe)
  api_key_env: TEACHER_API_KEY
  temperature: 0
  reasoning_effort: null  # gpt-4.1 is not a reasoning model; set "low" only for o-series / gpt-5
  response_format: json_schema   # or json_object if the API rejects our schema
  rpm: 60               # requests/minute; raise/lower to match the deployment's quota in Foundry
  # Models to compare in the pilot. The name must be a Foundry DEPLOYMENT name.
  # USD per 1M tokens, used only by the pilot report's cost estimate. Verify in the Foundry portal.
  candidates:
    gpt-4.1: {input: 2.0, output: 8.0}

student_local:          # llama.cpp `llama-server` or Ollama, Step 10
  base_url: http://localhost:8080/v1
  model: ticket-triage-q4
  api_key_env: null

base_candidates:        # verify exact repo names on Hugging Face in Step 06
  - TBD-1.5B-instruct
  - TBD-3B-instruct
