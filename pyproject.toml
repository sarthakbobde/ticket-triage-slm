[project]
name = "ticket-triage"
version = "0.1.0"
description = "Fine-tune and serve a small open-weight model for support-ticket triage."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "openai>=1.40",
    "httpx>=0.27",
    "datasets>=2.20",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
serve = ["fastapi>=0.111", "uvicorn>=0.30"]
# Step 09: merging the LoRA adapter into the base model (runs on the CPU). Same versions as the Kaggle run.
export = ["torch>=2.3", "transformers>=5.22,<6", "peft>=0.21,<0.22", "accelerate>=0.33"]

[project.scripts]
triage = "triage.cli:main"
# Training deps (torch, transformers, peft, trl, bitsandbytes) are installed on Kaggle only.
# See docs/DECISIONS.md#adr-004

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[dependency-groups]
# Dev-only tools: installed by `uv sync`, not part of the triage package.
dev = [
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "scikit-learn>=1.5",
    "seaborn>=0.13",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W style, F real mistakes (unused or missing names), I import order, B likely bugs.
# Deliberately NOT enabled: UP (pyupgrade). It rewrites plain code into newer, shorter syntax
# (for example Optional[float] -> float | None), which makes the code harder to read for this project.
select = ["E", "W", "F", "I", "B"]
# B007: a loop variable that is not used. Plain loops often unpack a pair and only need one half.
ignore = ["B007"]
