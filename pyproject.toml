[project]
name = "ticket-triage"
version = "0.1.0"
description = "Fine-tune and serve a small open-weight model for support-ticket triage."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "openai>=1.40",
    "httpx>=0.27",
    "datasets>=2.20",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
serve = ["fastapi>=0.111", "uvicorn>=0.30"]
# Training deps (torch, transformers, peft, trl, bitsandbytes) are installed on Kaggle only.
# See docs/DECISIONS.md#adr-004

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.uv]
# Dev-only tools: installed by `uv sync`, not part of the triage package.
dev-dependencies = [
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "scikit-learn>=1.5",
    "seaborn>=0.13",
]
